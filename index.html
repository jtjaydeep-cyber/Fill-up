<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Services Platform</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- pdf-lib CDN -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">🚗 Citizen Services Platform</a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-success fs-6" id="creditDisplay">Credits: 0</span>
        <span class="text-white small" id="userEmail">Not Logged In</span>
        <button class="btn btn-outline-light btn-sm" id="authBtn" onclick="toggleAuthModal()">Login / Sign Up</button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container my-4">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
      <h4 class="mb-3 text-primary">Vehicle Ownership Transfer</h4>
      <p class="text-muted small">Generates official Parivahan Form 29 & Form 30 for 1 Credit.</p>
      
      <form id="transferForm" onsubmit="event.preventDefault(); processVehicleTransfer();">
        <h6 class="fw-bold mt-3">1. VEHICLE DETAILS</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" id="regNo" class="form-control" placeholder="Reg Number (e.g. AS01AB1234)" required />
          </div>
          <div class="col-md-6">
            <input type="text" id="makeModel" class="form-control" placeholder="Make / Model" />
          </div>
          <div class="col-md-6">
            <input type="text" id="chassisNo" class="form-control" placeholder="Chassis No." />
          </div>
          <div class="col-md-6">
            <input type="text" id="engineNo" class="form-control" placeholder="Engine No." />
          </div>
        </div>

        <h6 class="fw-bold mt-4">2. SELLER DETAILS</h6>
        <div class="mb-2"><input type="text" id="sellerName" class="form-control" placeholder="Seller Full Name" required /></div>
        <div class="mb-2"><input type="text" id="sellerAddress" class="form-control" placeholder="Seller Address" /></div>
        <div class="mb-2"><input type="text" id="sellerRTO" class="form-control" placeholder="Seller RTO (e.g. RTO Guwahati)" /></div>

        <h6 class="fw-bold mt-4">3. BUYER DETAILS</h6>
        <div class="mb-2"><input type="text" id="buyerName" class="form-control" placeholder="Buyer Full Name" required /></div>
        <div class="mb-2"><input type="text" id="buyerAddress" class="form-control" placeholder="Buyer Address" /></div>
        <div class="mb-2"><input type="text" id="buyerRTO" class="form-control" placeholder="Buyer RTO" /></div>

        <button type="submit" class="btn btn-primary w-100 mt-4 py-2">Generate Forms 29 & 30 (1 Credit)</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Sign In / Sign Up</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="authEmail" class="form-control" placeholder="user@example.com" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="authPassword" class="form-control" placeholder="******" />
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn btn-primary flex-fill" onclick="handleAuth('login')">Log In</button>
            <button type="button" class="btn btn-success flex-fill" onclick="handleAuth('signup')">Sign Up (Get 5 Credits)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

  <script>
    let authModalInstance;

    window.addEventListener('load', () => {
      authModalInstance = new bootstrap.Modal(document.getElementById('authModal'));
      updateUI();
    });

    function toggleAuthModal() {
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        // Logout
        localStorage.removeItem('currentUser');
        updateUI();
        alert("Logged out successfully.");
      } else {
        authModalInstance.show();
      }
    }

    function handleAuth(type) {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      let users = JSON.parse(localStorage.getItem('appUsers') || '{}');

      if (type === 'signup') {
        if (users[email]) {
          alert("User already exists! Please Log In.");
          return;
        }
        users[email] = { password: password, credits: 5 };
        localStorage.setItem('appUsers', JSON.stringify(users));
        localStorage.setItem('currentUser', email);
        alert("Account created with 5 Free Credits!");
      } else {
        if (!users[email] || users[email].password !== password) {
          alert("Invalid email or password.");
          return;
        }
        localStorage.setItem('currentUser', email);
        alert("Login successful!");
      }

      authModalInstance.hide();
      updateUI();
    }

    function updateUI() {
      const currentUser = localStorage.getItem('currentUser');
      const authBtn = document.getElementById('authBtn');
      const userEmailSpan = document.getElementById('userEmail');
      const creditDisplay = document.getElementById('creditDisplay');

      if (currentUser) {
        const users = JSON.parse(localStorage.getItem('appUsers') || '{}');
        const user = users[currentUser] || { credits: 0 };
        userEmailSpan.innerText = currentUser;
        creditDisplay.innerText = `Credits: ${user.credits}`;
        authBtn.innerText = "Logout";
      } else {
        userEmailSpan.innerText = "Not Logged In";
        creditDisplay.innerText = "Credits: 0";
        authBtn.innerText = "Login / Sign Up";
      }
    }

    async function processVehicleTransfer() {
      const currentUser = localStorage.getItem('currentUser');
      if (!currentUser) {
        alert("Please Log In or Sign Up first.");
        authModalInstance.show();
        return;
      }

      let users = JSON.parse(localStorage.getItem('appUsers') || '{}');
      let user = users[currentUser];

      if (!user || user.credits < 1) {
        alert("Insufficient credits! You need at least 1 credit.");
        return;
      }

      const formData = {
        regNo: document.getElementById('regNo').value.toUpperCase(),
        makeModel: document.getElementById('makeModel').value,
        chassisNo: document.getElementById('chassisNo').value,
        engineNo: document.getElementById('engineNo').value,
        sellerName: document.getElementById('sellerName').value,
        sellerAddress: document.getElementById('sellerAddress').value,
        sellerRTO: document.getElementById('sellerRTO').value,
        buyerName: document.getElementById('buyerName').value,
        buyerAddress: document.getElementById('buyerAddress').value,
        buyerRTO: document.getElementById('buyerRTO').value,
      };

      // Deduct credit
      user.credits -= 1;
      users[currentUser] = user;
      localStorage.setItem('appUsers', JSON.stringify(users));
      updateUI();

      await generateForm29And30PDF(formData);
      alert("Forms generated successfully! 1 credit deducted.");
    }

    async function generateForm29And30PDF(data) {
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);

      // Page 1: Form 29
      const page1 = pdfDoc.addPage([595, 842]);
      page1.drawText('FORM 29', { x: 260, y: 800, size: 16, font: fontBold });
      page1.drawText('[See Rule 55(1)]', { x: 250, y: 785, size: 10, font: fontRegular });
      page1.drawText('NOTICE OF TRANSFER OF OWNERSHIP OF A MOTOR VEHICLE', { x: 110, y: 765, size: 11, font: fontBold, color: rgb(0, 0.3, 0.6) });

      let y = 720;
      page1.drawText(`To: The Registering Authority, ${data.sellerRTO}`, { x: 50, y, size: 10, font: fontBold });
      y -= 25;
      page1.drawText(`I, ${data.sellerName}, residing at ${data.sellerAddress},`, { x: 50, y, size: 10, font: fontRegular });
      y -= 15;
      page1.drawText(`hereby give notice that I have transferred ownership of motor vehicle No. ${data.regNo}`, { x: 50, y, size: 10, font: fontRegular });
      y -= 15;
      page1.drawText(`Make/Model: ${data.makeModel} | Chassis No: ${data.chassisNo} | Engine No: ${data.engineNo}`, { x: 50, y, size: 9, font: fontRegular });
      y -= 25;
      page1.drawText(`To Shri/Smt: ${data.buyerName}`, { x: 50, y, size: 10, font: fontBold });
      y -= 15;
      page1.drawText(`Residing at: ${data.buyerAddress}`, { x: 50, y, size: 10, font: fontRegular });
      y -= 50;
      page1.drawText('Signature of Transferor (Seller): _______________________', { x: 50, y, size: 9, font: fontBold });

      // Page 2: Form 30
      const page2 = pdfDoc.addPage([595, 842]);
      page2.drawText('FORM 30', { x: 260, y: 800, size: 16, font: fontBold });
      page2.drawText('[See Rule 55(2)]', { x: 250, y: 785, size: 10, font: fontRegular });
      page2.drawText('APPLICATION FOR INTIMATION AND TRANSFER OF OWNERSHIP', { x: 100, y: 765, size: 11, font: fontBold, color: rgb(0, 0.3, 0.6) });

      y = 720;
      page2.drawText(`To: The Registering Authority, ${data.buyerRTO}`, { x: 50, y, size: 10, font: fontBold });
      y -= 25;
      page2.drawText(`I, ${data.buyerName}, residing at ${data.buyerAddress},`, { x: 50, y, size: 10, font: fontRegular });
      y -= 15;
      page2.drawText(`hereby declare that I have acquired vehicle registration No. ${data.regNo} from ${data.sellerName}.`, { x: 50, y, size: 10, font: fontRegular });
      y -= 50;
      page2.drawText('Signature of Transferee (Buyer): _______________________', { x: 50, y, size: 9, font: fontBold });

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Form_29_30_${data.regNo}.pdf`;
      link.click();
    }
  </script>
</body>
</html>
